{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "langfuse-stack.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langfuse-stack.labels" . | nindent 4 }}
  {{- with .Values.secrets.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
stringData:
  # Core Langfuse secrets
  salt: {{ .Values.secrets.data.salt | quote }}
  encryption-key: {{ .Values.secrets.data.encryptionKey | quote }}
  nextauth-secret: {{ .Values.secrets.data.nextauthSecret | quote }}

  # PostgreSQL (Langfuse + groundhog2k/postgres subchart keys)
  postgresql-password: {{ .Values.secrets.data.postgresqlPassword | quote }}
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: {{ .Values.secrets.data.postgresqlPassword | quote }}
  POSTGRES_DB: {{ .Values.langfuse.postgresql.auth.database | default "langfuse" | quote }}
  USERDB_USER: {{ .Values.langfuse.postgresql.auth.username | default "langfuse" | quote }}
  USERDB_PASSWORD: {{ .Values.secrets.data.postgresqlPassword | quote }}

  # ClickHouse
  clickhouse-password: {{ .Values.secrets.data.clickhousePassword | quote }}

  # Redis / Valkey (Langfuse + Valkey ACL default user key)
  redis-password: {{ .Values.secrets.data.redisPassword | quote }}
  default: {{ .Values.secrets.data.redisPassword | quote }}

  # S3 / SeaweedFS (Langfuse + SeaweedFS IAM JSON config)
  s3-user: {{ .Values.secrets.data.s3User | quote }}
  s3-password: {{ .Values.secrets.data.s3Password | quote }}
  seaweedfs_s3_config: |
    {"identities":[{"name":{{ .Values.secrets.data.s3User | quote }},"credentials":[{"accessKey":{{ .Values.secrets.data.s3User | quote }},"secretKey":{{ .Values.secrets.data.s3Password | quote }}}],"actions":["Admin","Read","Write","List","Tagging"]}]}

  # First-boot auto-provisioned credentials (ported from docker-compose.langfuse.yml)
  langfuse-init-project-public-key: {{ .Values.secrets.data.initProjectPublicKey | quote }}
  langfuse-init-project-secret-key: {{ .Values.secrets.data.initProjectSecretKey | quote }}
  langfuse-init-user-password: {{ .Values.secrets.data.initUserPassword | quote }}
  admin-api-key: {{ .Values.secrets.data.adminApiKey | quote }}
{{- end }}
