{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "langfuse-stack.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "langfuse-stack.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.externalSecret.syncWave | default "-1" | quote }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "langfuse-stack.secretName" . }}
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Core Langfuse secrets
        salt: "{{ `{{ .salt }}` }}"
        encryption-key: "{{ `{{ index . \"encryption-key\" }}` }}"
        nextauth-secret: "{{ `{{ index . \"nextauth-secret\" }}` }}"

        # PostgreSQL (Langfuse + bundled groundhog2k/postgres subchart)
        postgresql-password: "{{ `{{ index . \"postgresql-password\" }}` }}"
        POSTGRES_USER: "postgres"
        POSTGRES_PASSWORD: "{{ `{{ index . \"postgresql-password\" }}` }}"
        POSTGRES_DB: {{ .Values.langfuse.postgresql.auth.database | default "langfuse" | quote }}
        USERDB_USER: {{ .Values.langfuse.postgresql.auth.username | default "langfuse" | quote }}
        USERDB_PASSWORD: "{{ `{{ index . \"postgresql-password\" }}` }}"

        # ClickHouse
        clickhouse-password: "{{ `{{ index . \"clickhouse-password\" }}` }}"

        # Redis / Valkey (Langfuse + Valkey ACL default user key)
        redis-password: "{{ `{{ index . \"redis-password\" }}` }}"
        default: "{{ `{{ index . \"redis-password\" }}` }}"

        # S3 / SeaweedFS
        s3-user: "{{ `{{ index . \"s3-user\" }}` }}"
        s3-password: "{{ `{{ index . \"s3-password\" }}` }}"
        seaweedfs_s3_config: "{{ `{{ .seaweedfs_s3_config }}` }}"

        # Headless bootstrap keys (ported from docker-compose.langfuse.yml)
        langfuse-init-project-public-key: "{{ `{{ index . \"langfuse-init-project-public-key\" }}` }}"
        langfuse-init-project-secret-key: "{{ `{{ index . \"langfuse-init-project-secret-key\" }}` }}"
        langfuse-init-user-password: "{{ `{{ index . \"langfuse-init-user-password\" }}` }}"
        admin-api-key: "{{ `{{ index . \"admin-api-key\" }}` }}"
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.remoteSecretKey | quote }}
{{- end }}
