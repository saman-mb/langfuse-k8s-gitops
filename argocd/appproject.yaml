apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: langfuse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Langfuse LLM observability stack (single-namespace deployment)
  sourceRepos:
    - "*"
  destinations:
    - namespace: langfuse
      server: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
